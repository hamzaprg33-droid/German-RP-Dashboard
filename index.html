<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>German RP – Team Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">
    <h1>German RP</h1>

    <div class="tabs">
        <button onclick="showTab('login')" id="loginTab" class="active">Login</button>
        <button onclick="showTab('register')" id="registerTab">Registrieren</button>
    </div>

    <!-- LOGIN -->
    <div id="login">
        <input id="loginName" placeholder="Benutzername">
        <input id="loginPass" type="password" placeholder="Passwort">
        <button>Login</button>
    </div>

    <!-- REGISTER -->
    <div id="register" class="hidden">
        <input id="regName" placeholder="Benutzername">
        <input id="regMail" type="email" placeholder="E-Mail">
        <input id="regDiscord" placeholder="Discord Benutzer-ID">
        <input id="regPass" type="password" placeholder="Passwort">

        <label>
            <input type="checkbox" id="privacy">
            Ich akzeptiere die <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a>
        </label>

        <button onclick="register()">Registrieren</button>
    </div>

    <!-- CODE -->
    <div id="verify" class="hidden">
        <input id="code" placeholder="6-stelliger Code">
        <button onclick="verify()">Bestätigen</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
